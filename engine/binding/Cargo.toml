[package]
name = "mw-binding"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The binding contract: a versioned adapter between a source standard and OKF plus a round-trip harness."
repository = "https://github.com/modelwrite/modelwrite"
readme = "README.md"
keywords = ["modelwrite","binding","okf","mbse"]

[lib]
name = "binding"

[dependencies]
mw-okf = { path = "../okf", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
mw-okf = { path = "../okf", version = "0.1.0" }
serde_json.workspace = true
