[package]
name = "mw-binding-capella"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Capella/Arcadia binding that reads the stated subset into OKF. A viewer: it imports but does not export."
repository = "https://github.com/modelwrite/modelwrite"
readme = "README.md"
keywords = ["modelwrite","capella","arcadia","stpa","binding","okf"]

[lib]
name = "binding_capella"

[dependencies]
mw-binding = { path = "../binding", version = "0.2.0" }
mw-okf = { path = "../okf", version = "0.2.0" }
roxmltree.workspace = true

[dev-dependencies]
mw-binding = { path = "../binding", version = "0.2.0" }
mw-okf = { path = "../okf", version = "0.2.0" }
serde_json.workspace = true
