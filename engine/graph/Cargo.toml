[package]
name = "mw-graph"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Graph analysis over OKF documents: node and edge statistics, isolation, components, and requirement coverage."
repository = "https://github.com/modelwrite/modelwrite"
readme = "README.md"
keywords = ["modelwrite","graph","okf","analysis"]
categories = ["algorithms"]

[lib]
name = "graph"

[dependencies]
mw-okf = { path = "../okf", version = "0.1.0" }
petgraph.workspace = true
serde.workspace = true
# Pinned so the engine layer stays buildable at the workspace rust-version floor
# (1.75). indexmap is petgraph's transitive dependency; 2.12+ needs 1.82, 2.14+
# needs 1.85 (edition2024). See the workspace.dependencies entry.
indexmap.workspace = true

[dev-dependencies]
mw-test-support = { path = "../test-support", version = "0.1.0" }
serde_json.workspace = true
