[package]
name = "mw-gate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The modelwrite round-trip fidelity gate: diff, validation, and graph health with deterministic evidence records."
repository = "https://github.com/modelwrite/modelwrite"
readme = "README.md"
keywords = ["modelwrite","gate","fidelity","evidence","mbse"]
categories = ["command-line-utilities"]

[lib]
name = "gate"

[[bin]]
name = "mw-gate"
path = "src/main.rs"

[dependencies]
mw-okf = { path = "../okf", version = "0.1.0" }
mw-graph = { path = "../graph", version = "0.1.0" }
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
mw-test-support = { path = "../test-support", version = "0.1.0" }
