[package]
name = "mw-binding-xmi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The SysML v1 XMI binding that reads the stated subset into OKF and writes it back."
repository = "https://github.com/modelwrite/modelwrite"
readme = "README.md"
keywords = ["modelwrite","xmi","sysml","binding","okf"]

[lib]
name = "binding_xmi"

[dependencies]
mw-binding = { path = "../binding", version = "0.1.0" }
mw-okf = { path = "../okf", version = "0.1.0" }
roxmltree.workspace = true

[dev-dependencies]
mw-binding = { path = "../binding", version = "0.1.0" }
mw-okf = { path = "../okf", version = "0.1.0" }
serde_json.workspace = true
