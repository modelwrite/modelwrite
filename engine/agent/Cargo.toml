[package]
name = "mw-agent"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The agent contract: proposals about a model and the human-readable review artifact that precedes any commit."
repository = "https://github.com/modelwrite/modelwrite"
readme = "README.md"
keywords = ["modelwrite","agent","proposals","review"]

[lib]
name = "agent"

[dependencies]
mw-binding = { path = "../binding", version = "0.2.0" }
mw-okf = { path = "../okf", version = "0.2.0" }
serde.workspace = true

[dev-dependencies]
mw-binding = { path = "../binding", version = "0.2.0" }
mw-binding-xmi = { path = "../binding-xmi", version = "0.2.0" }
mw-okf = { path = "../okf", version = "0.2.0" }
