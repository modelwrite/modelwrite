[package]
name = "mw-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A Model Context Protocol (MCP) server exposing modelwrite's OKF validation, graph, and gate tools over stdio."
repository = "https://github.com/modelwrite/modelwrite"
readme = "README.md"
keywords = ["modelwrite","mcp","model-context","okf"]

[lib]
name = "mcp"

[[bin]]
name = "mw-mcp"
path = "src/main.rs"

[dependencies]
mw-okf = { path = "../okf", version = "0.1.0" }
mw-graph = { path = "../graph", version = "0.1.0" }
mw-gate = { path = "../gate", version = "0.1.0" }
serde_json.workspace = true

[dev-dependencies]
mw-test-support = { path = "../test-support", version = "0.1.0" }
serde_json.workspace = true
