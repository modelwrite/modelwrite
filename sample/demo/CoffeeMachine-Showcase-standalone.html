<style>
  :root{
    --bg:#0f1216; --panel:#171b22; --panel2:#1e232c; --line:#2a313c; --txt:#e6e9ee; --muted:#9aa4b2;
    --accent:#c8873a; --accent2:#6ab0f3; --green:#63c088; --purple:#b98bd6; --red:#e0685f; --chip:#232a34;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;background:linear-gradient(90deg,#1a1f27,#12151b);border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  header h1 .c{color:var(--accent)}
  .chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--txt);font-size:13px}
  .body{flex:1;display:flex;min-height:0}
  nav{width:186px;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
  nav button{background:none;border:none;color:var(--muted);text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:9px}
  nav button:hover{background:var(--panel2);color:var(--txt)}
  nav button.active{background:var(--accent);color:#141414;font-weight:600}
  nav .sp{flex:1}
  nav .st{font-size:11px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
  main{flex:1;position:relative;min-width:0}
  .view{position:absolute;inset:0;overflow:auto;padding:18px;display:none}
  .view.active{display:block}
  .view.nopad{padding:0}
  #graph{width:100%;height:100%}
  h2{font-size:15px;color:var(--accent2);margin:0 0 12px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .card h3{margin:0 0 6px;font-size:14px}
  .card .st{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td .id{color:var(--accent);font-weight:600;font-family:ui-monospace,monospace}
  .tag{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:11px;color:var(--muted);margin:1px}
  .attr{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .flow{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);line-height:1.7}
  .flow .n{color:var(--txt)} .flow .g{color:var(--green)} .flow .a{color:var(--accent)}
  .legend{position:absolute;bottom:14px;left:14px;background:rgba(20,24,30,.9);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;z-index:5}
  .legend div{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--muted)}
  .dot{width:11px;height:11px;border-radius:50%}
  .gctl{position:absolute;top:14px;right:14px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;max-width:60%}
  .gctl button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
  .gctl button.on{background:var(--accent);color:#141414;border-color:var(--accent)}
  /* chat */
  #chat{display:flex;flex-direction:column;height:100%}
  #msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
  .msg.u{align-self:flex-end;background:var(--accent2);color:#0a0a0a}
  .msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;border:1px dashed var(--line)}
  .cbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
  .cbar input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--txt);font-size:13.5px}
  .cbar button{background:var(--accent);border:none;color:#141414;font-weight:600;border-radius:8px;padding:0 18px;cursor:pointer}
  .cbar button:disabled{opacity:.5;cursor:default}
  .suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
  .suggest span{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:4px 11px;font-size:12px;color:var(--muted);cursor:pointer}
  .banner{background:#3a2a12;border:1px solid var(--accent);color:#f0c88a;font-size:12px;padding:8px 12px;border-radius:8px;margin:0 16px 8px}
  a{color:var(--accent2)}
  /* digital twin */
  #twinWrap{display:flex;height:100%;min-height:0}
  #twinStage{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a2029,#0d1013);min-width:0}
  #twinStage svg{width:100%;height:100%;max-height:100%}
  #twinPanel{width:300px;border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
  .tp-state{text-align:center;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
  .tp-state .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .tp-state .val{font-size:22px;font-weight:700;color:var(--accent);margin-top:3px}
  .tp-state .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .tp-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tp-btns button{padding:11px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:13px;font-weight:600;cursor:pointer}
  .tp-btns button.power{grid-column:1/3;background:var(--green);color:#0a0a0a;border:none}
  .tp-btns button.power.on{background:var(--red);color:#fff}
  .tp-btns button.go{background:var(--accent);color:#141414;border:none}
  .tp-btns button:disabled{opacity:.4;cursor:default}
  .tp-row{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .tp-row b{color:var(--txt)}
  .tp-meter{height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
  .tp-meter > div{height:100%;transition:width .2s}
  .tp-req{padding:10px;border-radius:9px;font-size:12.5px;border:1px solid var(--line)}
  .tp-req.ok{background:#12281a;border-color:var(--green);color:#8fe0aa}
  .tp-req.bad{background:#2a1414;border-color:var(--red);color:#f0a09a}
  .tp-steps{display:flex;flex-direction:column;gap:5px}
  .tp-step{font-size:12px;color:var(--muted);padding:5px 9px;border-radius:7px;border:1px solid var(--line);display:flex;gap:7px;align-items:center}
  .tp-step.active{background:var(--accent);color:#141414;font-weight:600;border-color:var(--accent)}
  .tp-step.done{color:var(--green);border-color:#2c4a38}
  .tp-slider{width:100%}
  .tp-h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:-6px}
  /* market fit */
  .mk-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .mk-kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .mk-kpi .n{font-size:26px;font-weight:700}
  .mk-kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .mk-controls{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .mk-ctl label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .mk-ctl b{color:var(--accent)}
  .mk-ctl input[type=range]{width:100%}
  .mk-cell{text-align:center;font-weight:600;border-radius:5px;padding:3px 0}
  .mk-pass{background:#12281a;color:#63c088}
  .mk-fail{background:#2a1414;color:#e0685f}
  .mk-verdict td{font-weight:700}
  .mk-rec{background:#3a2a12;border:1px solid var(--accent);color:#f0c88a;border-radius:10px;padding:14px 16px;margin-top:14px;font-size:13.5px;line-height:1.55}
  .mk-rec b{color:#fff}
  .mk-src{font-size:11px;color:var(--muted);margin-top:12px}
  .mk-src a{color:var(--accent2)}
  .mk-price{color:var(--muted);font-size:12px}
  table.mk td, table.mk th{font-size:12.5px}
  /* fault injection */
  .tp-faults{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tp-faults button{padding:8px 6px;border-radius:8px;border:1px solid #5a2f2a;background:#2a1714;color:#f0b9b2;font-size:11.5px;cursor:pointer;text-align:left}
  .tp-faults button:hover{background:#3a1f1a}
  .tp-faults button.clear{grid-column:1/3;background:#12281a;border-color:#2c4a38;color:#8fe0aa}
  .tp-log{background:#0e1216;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:Consolas,monospace;font-size:11px;color:#9aa4b2;height:96px;overflow:auto;line-height:1.5}
  .tp-log .f{color:#e0685f}.tp-log .g{color:#63c088}.tp-log .a{color:var(--accent)}
  /* OEE */
  .oee-top{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-bottom:14px}
  .oee-ring{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .oee-comp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .oee-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .oee-card .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .oee-card .n{font-size:34px;font-weight:700;margin-top:4px}
  .oee-card .d{font-size:11px;color:var(--muted);margin-top:4px}
  .oee-meter{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;margin-top:8px}
  .oee-meter>div{height:100%}
  .oee-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:2px}
  .oee-kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
  .oee-kpi .n{font-size:24px;font-weight:700;color:var(--txt)}
  .oee-kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .oee-note{font-size:12px;color:var(--muted);margin-top:14px}
  /* OEE strip on twin */
  #twinStage{flex-direction:column}
  #twinStage svg#twinMachine{flex:1;min-height:0}
  #twinOee{width:94%;max-width:820px;margin:0 auto 10px;display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
  #twinOee .big{font-size:30px;font-weight:800;line-height:1}
  #twinOee .big small{font-size:11px;color:var(--muted);display:block;font-weight:600;letter-spacing:1px}

  #twinOee .apq div{flex:1}
  #twinOee .apq .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  #twinOee .apq .m{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:3px}
  #twinOee .apq .m>i{display:block;height:100%}
  #twinOee .apq .v{font-size:13px;font-weight:700;margin-top:2px}
  #twinOee .cups{text-align:right;font-size:12px;color:var(--muted)}
  #twinOee .cups b{color:var(--txt);font-size:16px}

  .on-def .big{font-size:17px;color:var(--txt);line-height:1.5}
  .on-def .big b{color:var(--accent)}
  .on-def .joke{font-size:13px;color:var(--muted);font-style:italic;margin-top:8px}
  .on-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
  .on-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .on-col h3{margin:0 0 3px;font-size:15px}
  .on-col .sub{font-size:11px;color:var(--muted);margin-bottom:10px}
  .on-chip{display:inline-block;border-radius:6px;padding:3px 9px;margin:3px 3px 3px 0;font-size:12px}
  .on-class{background:#2a2114;border:1px solid #5a4a2a;color:#e8c15a}
  .on-ind{background:#122228;border:1px solid #2a4a52;color:#7fd0e0}
  .on-rel{background:#221426;border:1px solid #4a2a52;color:#c89bd6;font-family:Consolas,monospace}
  table.on{width:100%;border-collapse:collapse;font-size:13px}
  table.on td,table.on th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
  table.on th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  table.on .s{color:#e8c15a;font-weight:600}
  table.on .p{color:#c89bd6;font-family:Consolas,monospace}
  table.on .o{color:#7fd0e0;font-weight:600}
  table.on .src{font-size:10px;color:var(--muted)}
  .on-infer{background:#12281a;border:1px solid #2c4a38;border-radius:12px;padding:16px 18px;margin-top:14px;font-size:13.5px;color:#bfe6cd;line-height:1.6}
  .on-infer b{color:#8fe0aa}
  .on-vs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
  .on-vs .c{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .on-vs .c h4{margin:0 0 4px;font-size:13px;color:var(--accent)}
  .on-vs .c p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.45}
</style>
</head>

function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

async function boot(){
  MODEL = window.__MODEL__ ? window.__MODEL__ : await (await fetch('coffee_machine_model.json?_='+Date.now())).json();
  renderChips(); renderGraph(); renderStructure(); renderSTM(); renderActs(); renderReqs();
  document.getElementById('meta').textContent = 'Exported '+ (MODEL.exportedAt||'');
  probeLLM();
}
function renderChips(){
  const s=MODEL.summary||{};
  const items=[['Blocks',s.blocks],['Requirements',s.requirements],['Signals',s.signals],['Activities',s.activities],['Graph nodes',s.graphNodes],['Relations',s.graphEdges]];
  document.getElementById('chips').innerHTML = items.map(([k,v])=>`<div class="chip">${k} <b>${v??0}</b></div>`).join('');
}

/* ---------- GRAPH ---------- */
let visNodes,visEdges,activeKinds=new Set(Object.keys(KIND_COLOR));
function renderGraph(){
  const g=MODEL.graph||{nodes:[],edges:[]};
  const shapeFor=k=>k==='requirement'?'box':(k==='signal'?'diamond':(k==='actor'?'triangle':(k==='usecase'?'ellipse':'dot')));
  visNodes=new vis.DataSet(g.nodes.map(n=>({id:n.id,label:n.name||n.kind,group:n.kind,
    color:{background:KIND_COLOR[n.kind]||'#888',border:'#0008',highlight:{background:KIND_COLOR[n.kind],border:'#fff'}},
    font:{color:'#e6e9ee',size:13},shape:shapeFor(n.kind),
    size:(n.kind==='block'?18:13)})));
  const em={transition:'#6ab0f3',part:'#c8873a',reference:'#d8a15a',dependency:'#b98bd6',generalization:'#888',object:'#63c088',control:'#63c088',association:'#8fa0b3',include:'#e8c15a',subject:'#556',behavior:'#5ad1c0',triggers:'#f38b8b',effect:'#f3c06a',uses:'#8fd15a',contains:'#7c8aa5'};
  visEdges=new vis.DataSet(g.edges.map((e,i)=>({id:i,from:e.source,to:e.target,label:e.label||'',arrows:'to',
    color:{color:em[e.kind]||'#556',opacity:.7},font:{color:'#9aa4b2',size:10,strokeWidth:0,align:'middle'},
    dashes:(e.kind==='dependency'||e.kind==='generalization'||e.kind==='behavior'||e.kind==='triggers'||e.kind==='contains'||e.kind==='uses'||e.kind==='effect'),smooth:{type:'dynamic'}})));
  network=new vis.Network(document.getElementById('graph'),{nodes:visNodes,edges:visEdges},{
    physics:{stabilization:true,barnesHut:{gravitationalConstant:-9000,springLength:130,springConstant:.04}},
    interaction:{hover:true,tooltipDelay:120},layout:{improvedLayout:true}});
  // legend + filters
  const lk={block:'Block',requirement:'Requirement',state:'State',activity:'Activity',signal:'Signal',interface:'Interface',usecase:'Use Case',actor:'Actor'};
  document.getElementById('legend').innerHTML=Object.entries(lk).map(([k,v])=>`<div><span class="dot" style="background:${KIND_COLOR[k]}"></span>${v}</div>`).join('');
  document.getElementById('gctl').innerHTML=Object.entries(lk).map(([k,v])=>`<button class="on" data-k="${k}">${v}</button>`).join('')+'<button data-fit="1">⤢ Fit</button>';
  document.getElementById('gctl').onclick=(ev)=>{const b=ev.target.closest('button');if(!b)return;
    if(b.dataset.fit){network.fit({animation:true});return;}
    const k=b.dataset.k;if(activeKinds.has(k)){activeKinds.delete(k);b.classList.remove('on');}else{activeKinds.add(k);b.classList.add('on');}
    visNodes.forEach(n=>visNodes.update({id:n.id,hidden:!activeKinds.has(n.group)}));};
}

/* ---------- STRUCTURE ---------- */
function renderStructure(){
  const v=document.getElementById('v-structure');
  v.innerHTML='<h2>System Structure — Blocks</h2>';
  const grid=el('div','grid');
  (MODEL.structure||[]).sort((a,b)=>a.name.localeCompare(b.name)).forEach(b=>{
    const c=el('div','card');
    c.innerHTML=`<div class="st">${(b.stereotypes||[]).join(', ')||'Block'}</div><h3>${b.name}</h3>`;
    if(b.documentation)c.appendChild(el('div','attr',b.documentation));
    if(b.attributes&&b.attributes.length){
      const ul=el('div','',''); b.attributes.forEach(a=>{const part=(a.aggregation||'').toLowerCase().includes('composite');
        ul.appendChild(el('div','attr',`${part?'◆ ':'• '}${a.name}${a.type?' : '+a.type:''}`));}); c.appendChild(ul);}
    grid.appendChild(c);
  });
  v.appendChild(grid);
}

/* ---------- STATE MACHINE ---------- */
function renderSTM(){
  const v=document.getElementById('v-stm'); const sm=MODEL.stateMachine;
  if(!sm){v.innerHTML='<h2>State Machine</h2><p class="attr">None.</p>';return;}
  v.innerHTML=`<h2>State Machine — ${sm.name}</h2>`;
  (sm.regions||[]).forEach((r,i)=>{
    const c=el('div','card'); c.innerHTML=`<div class="st">Region ${i+1}</div>`;
    const t=el('table'); t.innerHTML='<tr><th>State</th><th>Entry</th><th>Do</th><th>Exit</th></tr>';
    (r.states||[]).forEach(s=>{t.innerHTML+=`<tr><td><b>${s.name||'(unnamed)'}</b></td><td class="attr">${s.entry||''}</td><td class="attr">${s.doActivity||''}</td><td class="attr">${s.exit||''}</td></tr>`;});
    c.appendChild(t); v.appendChild(c);
  });
  // transitions from graph edges of kind transition
  const trs=(MODEL.graph.edges||[]).filter(e=>e.kind==='transition');
  if(trs.length){const c=el('div','card');c.innerHTML='<div class="st">Transitions</div>';
    const nm={};(MODEL.graph.nodes||[]).forEach(n=>nm[n.id]=n.name);
    const t=el('table');t.innerHTML='<tr><th>From</th><th>To</th><th>Trigger / Guard / Effect</th></tr>';
    trs.forEach(e=>{t.innerHTML+=`<tr><td>${nm[e.source]||'?'}</td><td>${nm[e.target]||'?'}</td><td class="flow">${e.label||''}</td></tr>`;});
    c.appendChild(t);v.appendChild(c);}
}

/* ---------- ACTIVITIES ---------- */
function renderActs(){
  const v=document.getElementById('v-acts'); v.innerHTML='<h2>Activities</h2>';
  (MODEL.activities||[]).forEach(a=>{
    const c=el('div','card');
    c.innerHTML=`<h3>${a.name}</h3>`;
    if(a.partitions&&a.partitions.length)c.appendChild(el('div','',a.partitions.map(p=>`<span class="tag">${p.name}${p.represents?' → '+p.represents:''}</span>`).join('')));
    if(a.edges&&a.edges.length){const f=el('div','flow');
      f.innerHTML=a.edges.map(e=>`<span class="n">${e.source||'•'}</span> →${e.type==='object'?'◆':''} <span class="n">${e.target||'•'}</span>${e.guard?' <span class="g">['+e.guard+']</span>':''}`).join('<br>');
      c.appendChild(f);}
    v.appendChild(c);
  });
}

/* ---------- REQUIREMENTS ---------- */
function renderReqs(){
  const v=document.getElementById('v-reqs');
  const rs=(MODEL.requirements||[]).slice().sort((a,b)=>{
    const ai=(a.stereotypes,a),bi=b; return (reqId(a)||'').localeCompare(reqId(b)||'',undefined,{numeric:true});});
  v.innerHTML=`<h2>Requirements (${rs.length})</h2>`;
  const t=el('table'); t.innerHTML='<tr><th style="width:70px">Id</th><th style="width:220px">Name</th><th>Text</th></tr>';
  rs.forEach(r=>{t.innerHTML+=`<tr><td class="id">${reqId(r)||''}</td><td><b>${r.name}</b></td><td class="attr">${reqText(r)||''}</td></tr>`;});
  const c=el('div','card'); c.appendChild(t); v.appendChild(c);
}
function reqId(r){return r.reqId||'';}
function reqText(r){return r.reqText||'';}

/* ---------- LLM CHAT ---------- */
function modelContext(){
  const m=MODEL; let s=`PROJECT: ${m.project}\n\nBLOCKS:\n`;
  (m.structure||[]).forEach(b=>{s+=`- ${b.name}`; if(b.attributes&&b.attributes.length)s+=` [parts/values: ${b.attributes.map(a=>a.name+(a.type?':'+a.type:'')).join(', ')}]`; if(b.documentation)s+=` — ${b.documentation}`; s+='\n';});
  if(m.stateMachine){s+=`\nSTATE MACHINE ${m.stateMachine.name}:\n`;
    (m.stateMachine.regions||[]).forEach(r=>(r.states||[]).forEach(st=>{s+=`- state ${st.name}`;if(st.entry)s+=` entry/${st.entry}`;if(st.doActivity)s+=` do/${st.doActivity}`;s+='\n';}));
    (m.graph.edges||[]).filter(e=>e.kind==='transition').forEach(e=>{const nm={};(m.graph.nodes||[]).forEach(n=>nm[n.id]=n.name);s+=`  transition ${nm[e.source]}->${nm[e.target]} ${e.label||''}\n`;});}
  s+='\nACTIVITIES:\n';(m.activities||[]).forEach(a=>{s+=`- ${a.name} (lanes: ${(a.partitions||[]).map(p=>p.name).join(', ')})\n`;});
  s+='\nREQUIREMENTS:\n';(m.requirements||[]).forEach(r=>{s+=`- ${reqId(r)||''} ${r.name}: ${reqText(r)||''}\n`;});
  try { if(typeof marketSummaryForChat==='function') s+=marketSummaryForChat(); } catch(e){}
  return s;
}
let CTX='';
async function probeLLM(){
  const b=document.getElementById('llmBanner');
  try{
    const r=await fetch(LLM_URL+'/api/tags');
    const j=await r.json();
    if(j.models&&j.models.length){LLM_MODEL=j.models[0].name;
      b.style.display='none';
      addMsg('sys','Connected to local model: '+LLM_MODEL+'. Ask me anything about the coffee machine model.');
    } else { b.innerHTML='Ollama is running but no model is pulled yet. Run <code>ollama pull qwen2.5:1.5b</code>.'; }
  }catch(e){ b.innerHTML='⚠ Local LLM not reachable at <code>localhost:11434</code>. Start Ollama (<code>ollama serve</code>) and pull a small model, then reload.'; }
  CTX=modelContext();
}
function addMsg(cls,txt){const m=el('div','msg '+cls,txt);document.getElementById('msgs').appendChild(m);m.scrollIntoView();return m;}
async function ask(q){
  addMsg('u',q);
  const a=addMsg('a','…');
  if(!LLM_MODEL){a.textContent='No local model available. Pull one with: ollama pull qwen2.5:1.5b';return;}
  try{
    const body={model:LLM_MODEL,stream:true,
      prompt:`You are a systems-engineering assistant. Answer ONLY from the SysML model below. Be concise and precise.\n\n===MODEL===\n${CTX}\n===END===\n\nQuestion: ${q}\nAnswer:`};
    const r=await fetch(LLM_URL+'/api/generate',{method:'POST',body:JSON.stringify(body)});
    const reader=r.body.getReader();const dec=new TextDecoder();a.textContent='';
    let buf='';
    while(true){const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){if(!ln.trim())continue;try{const j=JSON.parse(ln);if(j.response){a.textContent+=j.response;a.scrollIntoView();}}catch(e){}}}
  }catch(e){a.textContent='Error contacting LLM: '+e.message;}
}

const FAULTS={
  WATER_LOW:{code:'E1',msg:'WATER LOW',log:'Water tank &lt;500 mL — REQ 1.3 inhibits brew',cut:false},
  BEANS_LOW:{code:'E2',msg:'BEANS LOW',log:'Beans &lt;45 g — REQ 1.4 inhibits grind',cut:false},
  OVERHEAT:{code:'E3',msg:'OVERHEAT',log:'Boiler >170°C — REQ 1.2 thermostat cuts power',cut:true},
  INTERRUPT:{code:'E4',msg:'DREGS OUT',log:'Dregs drawer removed — REQ 3.1.3 interrupts operation',cut:false},
  SHORT:{code:'E5',msg:'⚡ SHOCK!',log:'Short on dispense energised the chassis — no RCD (REQ 3.1.5) — operator ZAPPED!',cut:true}

function induceFault(kind){
  if(!SIM) return;
  if(kind==='CLEAR'){
    if(SIM.fault){ SIMLOG('g','operator clears fault → refill/close → Idle'); }
    SIM.water=1; SIM.beans=1; SIM.lowWarned=false; if(SIM.temp>95)SIM.temp=TP.targetT; SIM.fault=null;
    if(SIM.power){ SIM.state='Idle'; SIM.stateT=0; } else { SIM.state='Off'; }
    return;
  }
  if(!SIM.power){ SIMLOG('a','machine is OFF — power on first'); return; }
  const F=FAULTS[kind]; if(!F) return;
  if(kind==='WATER_LOW') SIM.water=0.05;
  if(kind==='BEANS_LOW') SIM.beans=0.05;
  if(kind==='OVERHEAT') SIM.temp=182;
  // a brew in progress is spoiled
  if(SIM.state==='Brewing'){ SIM.cupsBad++; SIM.faultCount; SIMLOG('f','brew aborted → cup rejected (quality loss)'); }
  SIM.faultCount++; if(SIM.faultsByType[kind]!=null) SIM.faultsByType[kind]++;
  if(kind==='SHORT'){ SIM.shock=3.5; SIMLOG('f','⚡💀 ZAP! The barista got shocked! An RCD (REQ 3.1.5) would have tripped first.'); }
  SIMLOG('f','⚠ '+F.code+' '+F.msg+': '+F.log);
  if(F.cut){ SIM.power=false; SIM.state='Fault'; SIM.fault=kind; SIMLOG('f','STM: On → (PowerOff by thermostat) → Off/Fault'); }
  else { SIM.prevState=SIM.state; SIM.state='Fault'; SIM.fault=kind; SIMLOG('a','STM: '+SIM.prevState+' → Fault — alert user (System Alert)'); }
  SIM.brewStep=-1; SIM.cup=0;
}

function twinTick(dtReal){
  if(!SIM)return; const dt=dtReal*SIM.speed;
  const P=TP;
  if(SIM.wave>0) SIM.wave-=dtReal;
  if(SIM.shock>0 && SIM.fault!=='SHORT') SIM.shock-=dtReal;
  // OEE time accounting: the machine's active window = powered on OR halted in a fault
  const active = SIM.power || SIM.state==='Fault';
  if(active){ SIM.runSec+=dt; if(SIM.state==='Fault') SIM.downSec+=dt; else SIM.operSec+=dt; }
  // FAULT: machine halted, awaiting operator; boiler cools if power was cut
  if(SIM.state==='Fault'){ SIM.heating=false; if(!SIM.power && SIM.temp>P.inputT) SIM.temp-=dt*1.5; SIM.bladeAng+=0; return; }
  if(!SIM.power){ SIM.state='Off'; SIM.heating=false; if(SIM.temp>P.inputT) SIM.temp-=dt*2; if(SIM.temp<P.inputT)SIM.temp=P.inputT; return; }
  SIM.t+=dt; SIM.stateT+=dt;
  // concurrent Heating region: thermostat cycling once up to temp; below target -> heating on
  SIM.heating = SIM.temp < (P.targetT+1);
  if(SIM.heating){ SIM.heatElapsed+=dt; SIM.temp=Math.min(99, P.inputT + Math.sqrt(SIM.boilingFactor)*SIM.heatElapsed); }
  else { SIM.temp += Math.sin(SIM.t*3)*0.15; }
  // self-protect: runaway temperature trips the thermostat (REQ 1.2)
  if(SIM.temp>170){ induceFault('OVERHEAT'); return; }
  // requirement 1.1 check at targetTime
  if(SIM.req===null && SIM.t>=P.targetTime){ SIM.reqTemp = P.inputT + Math.sqrt(SIM.boilingFactor)*P.targetTime; SIM.req = SIM.reqTemp>=P.targetT; }
  if(SIM.state==='Initialising'){ if(SIM.stateT>=30){ SIM.state='Idle'; SIM.stateT=0; SIMLOG('a','Initialising → Idle after(30 s)'); } }
  else if(SIM.state==='Idle'){
    if(SIM.autoServe && SIM.stateT>0.5){
      if(SIM.beans<0.1){ induceFault('BEANS_LOW'); }
      else { SIM.state='Brewing'; SIM.stateT=0; SIM.brewStep=0; SIM.brewT=0; SIM.cup=0; SIMLOG('a','Selection Made → Brewing (auto-serve)'); }
    }
  }
  else if(SIM.state==='Brewing'){
    SIM.brewT+=dt;
    const step=Math.min(3,Math.floor(SIM.brewT/6)); SIM.brewStep=step;
    if(step===1){ SIM.bladeAng+=dt*400; }
    if(step>=2){
      SIM.water=Math.max(0, SIM.water-dt*0.02);
      if(SIM.water<=0.1 && SIM.water>0 && !SIM.lowWarned){ SIM.lowWarned=true; SIMLOG('f','⚠ water low — a compliant design would inhibit the brew here (REQ 1.3); this machine keeps dispensing…'); }
      if(SIM.water<=0){ SIMLOG('f','tank ran DRY mid-dispense → element/pump energised the wet chassis (no isolation)'); induceFault('SHORT'); return; }
    }
    if(step===3){ SIM.cup=Math.min(1, SIM.cup + dt*0.10); }
    if(SIM.brewT>=24){ SIM.state='Idle'; SIM.stateT=0; SIM.brewStep=-1; SIM.cupsGood++; SIMLOG('g','Brew Complete → Idle (Clean System) — cup #'+(SIM.cupsGood)+' ✓'); }
  }
}
function lerpColor(a,b,t){const p=(x,i)=>parseInt(x.substr(i,2),16);const r=Math.round(p(a,1)+(p(b,1)-p(a,1))*t),g=Math.round(p(a,3)+(p(b,3)-p(a,3))*t),bl=Math.round(p(a,5)+(p(b,5)-p(a,5))*t);return `rgb(${r},${g},${bl})`;}
function twinRender(){
  if(!SIM)return; const P=TP; const $=id=>document.getElementById(id);
  const tempPct=Math.max(0,Math.min(1,(SIM.temp-20)/(100-20)));
  // boiler fill color blue->red

  // electrocution easter egg

  const rq=$('tpReq'), rqt=$('tpReqTxt');

  else { rq.className='tp-req bad'; rqt.textContent='✗ NOT met — only '+SIM.reqTemp.toFixed(1)+'°C at '+P.targetTime+'s (raise boilingFactor)'; }
  document.querySelectorAll('#tpSteps .tp-step').forEach((el,i)=>{ el.classList.toggle('active', SIM.state==='Brewing'&&SIM.brewStep===i); el.classList.toggle('done', SIM.state==='Brewing'&&SIM.brewStep>i); });

function oeeColor(v){ return v>=0.85?'#63c088':(v>=0.6?'#e8c15a':'#e0685f'); }
function oeeCalc(){
  if(!SIM) return {A:1,P:0,Q:1,OEE:0,tph:0,total:0,good:0,bad:0,run:0,down:0,started:false};
  const run=SIM.runSec, oper=SIM.operSec, down=SIM.downSec, total=SIM.cupsGood+SIM.cupsBad;
  const A=run>0?oper/run:1, P=oper>0?Math.min(1,(total*SIM.idealCycle)/oper):0, Q=total>0?SIM.cupsGood/total:1;
  return {A,P,Q,OEE:A*P*Q,tph:oper>0?SIM.cupsGood/(oper/3600):0,total,good:SIM.cupsGood,bad:SIM.cupsBad,run,down,started:run>1};
}
function updateTwinStrip(){

  const set=(id,v)=>{const e=document.getElementById(id); if(e){e.style.width=pc(v)+'%'; e.style.background=oeeColor(v);}};
  set('toeeAm',m.A); set('toeePm',m.P); set('toeeQm',m.Q);
  document.getElementById('toeeA').textContent=pc(m.A)+'%';
  document.getElementById('toeeP').textContent=pc(m.P)+'%';
  document.getElementById('toeeQ').textContent=pc(m.Q)+'%';
  document.getElementById('toeeCups').textContent=m.good;
  document.getElementById('toeeTph').textContent=m.tph.toFixed(1);
  document.getElementById('toeeBad').textContent=m.bad+' rejected';
}

  const col=oeeColor(pct);
  return `<svg width="180" height="180" viewBox="0 0 180 180">
    <circle cx="90" cy="90" r="${r}" fill="none" stroke="#2a313c" stroke-width="16"/>
    <circle cx="90" cy="90" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 90 90)"/>
    <text x="90" y="86" fill="#e6e9ee" font-size="40" font-weight="700" text-anchor="middle">${val}</text>
    <text x="90" y="110" fill="#9aa4b2" font-size="12" text-anchor="middle" letter-spacing="1">${label}</text>
  </svg>`;
}
function paretoSVG(fb){
  const labels={WATER_LOW:['Water low','(REQ 1.3)'],BEANS_LOW:['Beans low','(REQ 1.4)'],OVERHEAT:['Overheat','(REQ 1.2)'],INTERRUPT:['Dregs out','(REQ 3.1.3)'],SHORT:['Shock','(REQ 3.1.5)']};
  let data=Object.keys(fb).map(k=>({k,label:labels[k],n:fb[k]})).sort((a,b)=>b.n-a.n);
  const total=data.reduce((s,d)=>s+d.n,0);
  if(total===0) return '<div style="color:var(--muted);font-size:13px;padding:24px;text-align:center">No faults recorded yet — inject some on the Digital Twin page, then come back.</div>';
  const W=680,H=250,pl=40,pr=48,pt=16,pb=48, iw=W-pl-pr, ih=H-pt-pb;
  const gap=iw/data.length, bw=gap*0.55, maxN=Math.max(...data.map(d=>d.n));
  let cum=0, bars='', pts=[];
  data.forEach((d,i)=>{
    const x=pl+i*gap+gap/2, bh=maxN? d.n/maxN*ih:0;
    bars+=`<rect x="${x-bw/2}" y="${pt+ih-bh}" width="${bw}" height="${bh}" rx="3" fill="#c8873a"/>`;
    if(d.n>0) bars+=`<text x="${x}" y="${pt+ih-bh-6}" fill="#e6e9ee" font-size="12" font-weight="700" text-anchor="middle">${d.n}</text>`;
    d.label.forEach((ln,j)=>{ bars+=`<text x="${x}" y="${H-pb+16+j*13}" fill="#9aa4b2" font-size="10.5" text-anchor="middle">${ln}</text>`; });
    cum+=d.n; pts.push([x, pt+ih-(cum/total)*ih, Math.round(cum/total*100)]);
  });
  const line=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#63c088" stroke-width="2"/>`;
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#63c088"/><text x="${p[0]+7}" y="${p[1]-5}" fill="#8fe0aa" font-size="10" font-weight="600">${p[2]}%</text>`).join('');
  const axis=`<line x1="${pl}" y1="${pt}" x2="${pl}" y2="${pt+ih}" stroke="#2a313c"/><line x1="${pl}" y1="${pt+ih}" x2="${W-pr}" y2="${pt+ih}" stroke="#2a313c"/>`+
             `<text x="${pl-6}" y="${pt+6}" fill="#6b7686" font-size="9" text-anchor="end">${maxN}</text><text x="${W-pr+6}" y="${pt+6}" fill="#63c088" font-size="9">100%</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${axis}${bars}${line}${dots}</svg>`;
}
function renderOEE(){
  const v=document.getElementById('v-oee');
  if(!SIM){ v.innerHTML='<h2>OEE / Throughput</h2><p class="attr">Open the Digital Twin first to start the simulation.</p>'; return; }
  const run=SIM.runSec, oper=SIM.operSec, down=SIM.downSec;
  const total=SIM.cupsGood+SIM.cupsBad;
  const A = run>0? oper/run : 1;
  const P = oper>0? Math.min(1,(total*SIM.idealCycle)/oper) : 0;
  const Q = total>0? SIM.cupsGood/total : 1;
  const OEE = A*P*Q;
  const tph = oper>0? (SIM.cupsGood/(oper/3600)) : 0;
  const pc=x=>Math.round(x*100);
  const started = run>1;
  let html=`<div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin-bottom:4px">OEE / Throughput — live from the digital twin</h2><button onclick="resetMetrics()" style="background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer">↺ Reset metrics</button></div>
    <div style="font-size:12.5px;color:var(--muted);margin:-2px 0 14px">Overall Equipment Effectiveness = Availability × Performance × Quality, accumulated as the twin runs. Turn on <b style="color:#63c088">Auto-serve</b> on the Digital Twin page for continuous production, then inject faults to watch OEE react.</div>`;
  if(!started){
    html+=`<div class="card" style="text-align:center;padding:40px"><div style="font-size:15px;color:var(--muted)">No production yet. Go to <b style="color:var(--accent)">🎛 Digital Twin</b>, power on and brew a few coffees (try inducing a fault) — metrics will appear here live.</div></div>`;
    v.innerHTML=html; return;
  }
  html+=`<div class="oee-top">
    <div class="oee-ring"><div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Overall OEE</div>${ring(OEE,'OEE',pc(OEE)+'%')}
      <div style="font-size:11px;color:var(--muted);margin-top:8px">${OEE>=0.85?'World-class (≥85%)':(OEE>=0.6?'Typical (60–85%)':'Below par (<60%)')}</div></div>
    <div class="oee-comp">
      ${[['Availability',A,'uptime ÷ scheduled','fault downtime '+Math.round(down)+'s'],
         ['Performance',P,'actual ÷ ideal rate','ideal cycle '+SIM.idealCycle+'s/cup'],
         ['Quality',Q,'good ÷ total cups',SIM.cupsBad+' rejected']].map(([l,val,d,d2])=>`
        <div class="oee-card"><div class="l">${l}</div><div class="n" style="color:${oeeColor(val)}">${pc(val)}%</div>
          <div class="oee-meter"><div style="width:${pc(val)}%;background:${oeeColor(val)}"></div></div>
          <div class="d">${d}<br>${d2}</div></div>`).join('')}
    </div></div>
    <div class="oee-kpis">
      ${[[tph.toFixed(1),'cups / hour (sim)'],[SIM.cupsGood,'good cups'],[SIM.cupsBad,'rejected cups'],[SIM.faultCount,'faults'],
         [Math.round(run)+'s','run time'],[Math.round(down)+'s','downtime'],[total,'total brews'],[pc(A*P*Q)+'%','OEE']].slice(0,4).map(([n,l])=>`
        <div class="oee-kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}
    </div>
    <div class="oee-kpis" style="margin-top:12px">
      ${[[Math.round(run)+'s','run time'],[Math.round(down)+'s','fault downtime'],[total,'total brews'],[SIM.faultCount,'faults injected']].map(([n,l])=>`
        <div class="oee-kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}
    </div>
    <div class="card" style="margin-top:14px"><div style="font-size:13px;color:var(--muted);margin-bottom:4px"><b style="color:var(--txt)">Fault Pareto</b> — downtime causes ranked by frequency, with cumulative % (green). Classic "vital few": tackle the leftmost bars first for the biggest availability gain.</div>${paretoSVG(SIM.faultsByType)}</div>
    <div class="oee-note">Availability drops when the STM enters a <b style="color:#e0685f">Fault</b> state (empty tank, low beans, overheat, interruption); Quality drops when a fault spoils an in-progress brew; Performance reflects throughput vs the ideal ${SIM.idealCycle}s cycle. This closes the loop from the SysML behaviour model to operational KPIs.</div>`;
  v.innerHTML=html;
}

/* ================= ONTOLOGY (an example, half in jest) ================= */
function renderOntology(){
  const v=document.getElementById('v-onto');
  const nm={}; (MODEL.graph.nodes||[]).forEach(n=>nm[n.id]=n.name);
  const pred={part:'hasPart',reference:'references',transition:'transitionsTo',association:'associatedWith',generalization:'isA',include:'includes',subject:'appliesTo',
              behavior:'performsBehaviour',triggers:'triggers',effect:'onExitPerforms',uses:'usesSignal',contains:'contains',
              dependency:'dependsOn','Satisfy':'satisfies','Refine':'refines'};
  // pull a few real triples from the model
  const modelTriples=[]; const seen=new Set();
  (MODEL.graph.edges||[]).forEach(e=>{
    let p=pred[e.kind]||e.kind; if(e.kind==='dependency'){ p = /satisf/i.test(e.label)?'satisfies':(/refin/i.test(e.label)?'refines':'dependsOn'); }
    const s=nm[e.source], o=nm[e.target]; if(!s||!o) return;
    const key=s+p+o; if(seen.has(key)) return; seen.add(key);
    if(['hasPart','satisfies','refines','transitionsTo','associatedWith'].includes(p)) modelTriples.push([s,p,o]);
  });
  const pick=(p,n)=>modelTriples.filter(t=>t[1]===p).slice(0,n);
  const shown=[...pick('hasPart',3),...pick('transitionsTo',2),...pick('satisfies',2),...pick('associatedWith',2)];
  // curated domain triples the ontology adds ON TOP of the SysML model (class-level knowledge + axioms)
  const domain=[["Espresso","subClassOf","Coffee"],["Coffee","subClassOf","Beverage"],
    ["Boiler","heats","Water"],["CoffeeMachine","produces","Beverage"],
    ["Barista","operates","CoffeeMachine"],["Brewing","requires","HotWater"]];
  const row=(t,src)=>`<tr><td class="s">${t[0]}</td><td class="p">${t[1]}</td><td class="o">${t[2]}</td><td class="src">${src}</td></tr>`;
  v.innerHTML=`<h2>Ontology — a worked example (settle the debate) ☕</h2>
   <div class="on-def">
     <div class="big">An <b>ontology</b> is a shared, formal vocabulary: the <b>classes</b> (kinds of things), the <b>individuals</b> (specific things), the <b>relationships</b> between them, and <b>axioms/rules</b> — written so a <i>machine</i> can reason over them, not just store them.</div>
     <div class="joke">It is <b>not</b> a diagram, <b>not</b> a database schema, and <b>not</b> "just a fancy taxonomy" — though someone on the team will die on that hill. The test: can it <b>infer a fact nobody typed in?</b> A taxonomy can't. An ontology can (see the green box).</div>
   </div>
   <div class="on-cols">
     <div class="on-col"><h3 style="color:#e8c15a">Classes</h3><div class="sub">concepts / types — "T-Box"</div>
       ${['CoffeeMachine','Subsystem','Boiler','WaterTank','Beverage','Coffee','Requirement','State','Activity','Signal','Actor'].map(c=>`<span class="on-chip on-class">${c}</span>`).join('')}</div>
     <div class="on-col"><h3 style="color:#7fd0e0">Individuals</h3><div class="sub">instances — "A-Box"</div>
       ${['MEMKO-Barista-001','Boiler-B1','Espresso','Long-Black','Alice (Coffee Consumer)','Sam (Maintenance Op)','WaterTank-WT1'].map(c=>`<span class="on-chip on-ind">${c}</span>`).join('')}</div>
     <div class="on-col"><h3 style="color:#c89bd6">Relationships</h3><div class="sub">object properties + axioms</div>
       ${['hasPart','heats','produces','satisfies','triggers','isInState','requires','operates','subClassOf'].map(c=>`<span class="on-chip on-rel">${c}</span>`).join('')}</div>
   </div>
   <div class="card"><div style="font-size:13px;color:var(--muted);margin-bottom:8px">Knowledge as <b style="color:var(--txt)">triples</b> — subject → predicate → object. The blue ones are read straight from your SysML model; the amber ones are class-level knowledge an ontology layers on top.</div>
     <table class="on"><tr><th>Subject</th><th>Predicate</th><th>Object</th><th>Source</th></tr>
       ${shown.map(t=>row(t,'● model')).join('')}
       ${domain.map(t=>row(t,'○ ontology')).join('')}
     </table></div>
   <div class="on-infer"><b>Why it matters (the punchline):</b> the ontology knows <span class="p" style="color:#8fe0aa">Espresso subClassOf Coffee</span>, <span class="p" style="color:#8fe0aa">Coffee subClassOf Beverage</span>, and <span class="p" style="color:#8fe0aa">CoffeeMachine produces Beverage</span>. From those axioms a reasoner <b>infers a brand-new fact nobody stated</b>: <b>“MEMKO-Barista-001 can produce an Espresso.”</b> A taxonomy just filed Espresso under Coffee; a database schema stored a row. Neither can derive that. That inference — not the boxes-and-lines — is what makes it an ontology.</div>
   <div class="on-vs">
     <div class="c"><h4>Taxonomy</h4><p>Pure is-a hierarchy. Classifies (Coffee → Espresso). No typed relations, no reasoning.</p></div>
     <div class="c"><h4>DB Schema</h4><p>Tables & constraints for storage. Knows columns, not meaning. Can't infer.</p></div>
     <div class="c"><h4>Folksonomy</h4><p>Free tags (#coffee #morning). Social, flexible, informal — zero logic.</p></div>
     <div class="c"><h4>Ontology</h4><p>Classes + individuals + typed relations + <b style="color:var(--accent)">axioms</b> → a machine can <b style="color:var(--accent)">reason & infer</b>.</p></div>
   </div>
   <div class="oee-note">Everything above is generated from the same coffee-machine model — the SysML model gives structure &amp; behaviour; the ontology view reframes it as a reasonable knowledge graph. (And yes, you can now win the argument at standup.)</div>`;
}
