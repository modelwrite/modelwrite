[package]
name = "mw-server"
version = "0.2.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "The modelwrite model service: repository, version control, gate, merge, and lock enforcement over OKF with a workbench UI and an HTTP API."
repository = "https://github.com/modelwrite/modelwrite"
readme = "README.md"
keywords = ["modelwrite", "server", "okf", "mbse", "repository"]
categories = ["web-programming::http-server"]

[lib]
name = "server"

[[bin]]
name = "mw-server"
path = "src/main.rs"

[features]
default = ["postgres", "smtp"]
# The PostgreSQL backend is compiled by default so its tests compile and skip cleanly
# when MW_TEST_DATABASE_URL is unset. Build with --no-default-features to omit it and
# every dependency it pulls (including the rustls TLS stack).
postgres = [
    "dep:postgres",
    "dep:r2d2",
    "dep:r2d2_postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
]
# The SMTP transport needs a TLS client for STARTTLS. rustls and the system trust store are
# already in the tree for the PostgreSQL backend, so the mailer reuses them rather than
# adding a dependency: MW_MAILER=smtp is the same binary dialling a real provider.
smtp = ["dep:rustls", "dep:rustls-native-certs"]

[dependencies]
mw-okf = { path = "../engine/okf", version = "0.2.0" }
mw-graph = { path = "../engine/graph", version = "0.2.0" }
mw-gate = { path = "../engine/gate", version = "0.2.0" }
mw-binding = { path = "../engine/binding", version = "0.2.0" }
mw-binding-xmi = { path = "../engine/binding-xmi", version = "0.2.0" }
mw-binding-sysmlv2 = { path = "../engine/binding-sysmlv2", version = "0.1.0" }
mw-agent = { path = "../engine/agent", version = "0.2.0" }
mw-analytics = { path = "../engine/analytics", version = "0.2.0" }
axum = { workspace = true, features = ["multipart"] }
# futures-util feeds axum::body::Body::from_stream: the analytics table endpoint streams
# large tables (the TMT import_losses table is ~50k rows) one row at a time through a
# TryStream instead of buffering the whole table. It is already in the workspace's
# dependency tree (axum-core depends on it); default-features are off so only the std
# stream combinators (iter, once, chain, map) are added, not the async-await macros.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio.workspace = true
rusqlite = { workspace = true, features = ["blob"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
base64 = "0.22"
# Cryptographically secure randomness for login codes, session tokens and trial ids.
rand = "0.8"
anyhow.workspace = true
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
maud = "0.27.0"
# A minimal blocking HTTP client for the live assist reasoner. No model provider is
# embedded: the key and the endpoint come from the deployment's environment.
ureq = { version = "2", features = ["json"] }
postgres = { version = "0.19", optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2_postgres = { version = "0.18", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[dev-dependencies]
mw-mcp = { path = "../engine/mcp", version = "0.2.0" }
mw-test-support = { path = "../engine/test-support", version = "0.2.0" }
base64 = "0.22"
tower.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
serde_json.workspace = true
postgres = { version = "0.19" }
