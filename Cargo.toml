[workspace]
resolver = "2"
members = ["engine/okf", "engine/test-support", "engine/graph"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/modelwrite/modelwrite"

[workspace.dependencies]
anyhow = "1.0"
hex = "0.4"
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
