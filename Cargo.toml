[workspace]
resolver = "2"
members = ["engine/okf", "engine/test-support", "engine/graph", "engine/gate", "engine/binding", "engine/binding-xmi", "engine/agent", "engine/capi", "engine/mcp", "engine/analytics", "server", "cli"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/modelwrite/modelwrite"

[workspace.dependencies]
anyhow = "1.0"
hex = "0.4"
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
roxmltree = "0.21"
