[workspace]
resolver = "2"
members = ["engine/okf", "engine/test-support", "engine/graph", "engine/gate", "engine/binding", "engine/binding-xmi", "engine/binding-sysmlv2", "engine/binding-capella", "engine/agent", "engine/capi", "engine/mcp", "engine/analytics", "server", "cli"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/modelwrite/modelwrite"

[workspace.dependencies]
anyhow = "1.0"
hex = "0.4"
petgraph = "0.6"
# indexmap is petgraph's transitive dependency (via engine/graph). It is pinned
# to the last release whose rust-version is <= the workspace floor of 1.75:
# indexmap 2.12 raised its MSRV to 1.82 and 2.14 to 1.85 (edition2024). Without
# this pin the engine layer resolves indexmap 2.14 and silently breaks the
# declared 1.75 floor. The msrv CI job builds the engine layer at 1.75 to keep
# the claim verified.
indexmap = "=2.11.4"
# zeroize is rustls's transitive dependency. 1.9.0 raised its edition to 2024
# (rustc 1.85), which would break the engine layer's 1.75 floor now that mw-mcp
# speaks TLS over rustls. Pinned to the last edition-2021 release (MSRV 1.60).
zeroize = "=1.8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
roxmltree = "0.21"
